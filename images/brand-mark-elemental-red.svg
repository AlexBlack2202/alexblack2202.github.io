<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Elemental knot</title>
  <desc id="desc">Three molten red glass ribbons orbit an amber earth core.</desc>
  <defs>
    <linearGradient id="pearl-base" x1="24" y1="18" x2="139" y2="146" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf9"/>
      <stop offset="0.52" stop-color="#fff3ed"/>
      <stop offset="1" stop-color="#ffd8cf"/>
    </linearGradient>
    <radialGradient id="warm-glow" cx="0" cy="0" r="1" gradientTransform="translate(122 124) rotate(-132) scale(95)">
      <stop stop-color="#ff5a38" stop-opacity="0.24"/>
      <stop offset="0.72" stop-color="#ff5a38" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ff5a38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire-one" x1="80" y1="27" x2="117" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff6543"/>
      <stop offset="0.48" stop-color="#ef2535"/>
      <stop offset="1" stop-color="#a90d2d"/>
    </linearGradient>
    <linearGradient id="fire-two" x1="122" y1="97" x2="43" y2="123" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff4935"/>
      <stop offset="0.5" stop-color="#d71938"/>
      <stop offset="1" stop-color="#8d1333"/>
    </linearGradient>
    <linearGradient id="fire-three" x1="39" y1="110" x2="65" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff713f"/>
      <stop offset="0.5" stop-color="#e21c35"/>
      <stop offset="1" stop-color="#a60f31"/>
    </linearGradient>
    <radialGradient id="earth-core" cx="0" cy="0" r="1" gradientTransform="translate(75 72) rotate(50) scale(27)">
      <stop stop-color="#fff1bf"/>
      <stop offset="0.48" stop-color="#f3ba58"/>
      <stop offset="1" stop-color="#b86b2a"/>
    </radialGradient>
    <filter id="base-shadow" x="-30%" y="-30%" width="160%" height="175%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#7c2535" flood-opacity="0.18"/>
    </filter>
    <filter id="ribbon-shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#78132a" flood-opacity="0.28"/>
    </filter>
    <clipPath id="squircle">
      <rect x="8" y="8" width="144" height="144" rx="43"/>
    </clipPath>
  </defs>

  <g filter="url(#base-shadow)">
    <rect x="8" y="8" width="144" height="144" rx="43" fill="url(#pearl-base)"/>
    <g clip-path="url(#squircle)">
      <rect x="8" y="8" width="144" height="144" fill="url(#warm-glow)"/>
      <ellipse cx="42" cy="26" rx="70" ry="53" fill="#fff" opacity="0.48"/>
      <path d="M-5 132c42-27 75-20 104-1 22 14 45 15 72-2v39H-5Z" fill="#d91535" opacity="0.05"/>
    </g>
    <rect x="9.5" y="9.5" width="141" height="141" rx="41.5" fill="none" stroke="#fff" stroke-width="3" stroke-opacity="0.9"/>
  </g>

  <g filter="url(#ribbon-shadow)" transform="translate(80 80) scale(1.12) translate(-80 -80)">
    <path d="M80 25c19 14 24 30 18 44-4 10-13 18-22 23-7-8-11-17-9-28 2-14 7-28 13-39Z" fill="url(#fire-one)"/>
    <path d="M80 25c19 14 24 30 18 44-4 10-13 18-22 23-7-8-11-17-9-28 2-14 7-28 13-39Z" fill="url(#fire-two)" transform="rotate(120 80 80)"/>
    <path d="M80 25c19 14 24 30 18 44-4 10-13 18-22 23-7-8-11-17-9-28 2-14 7-28 13-39Z" fill="url(#fire-three)" transform="rotate(240 80 80)"/>
  </g>

  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.5" transform="translate(80 80) scale(1.12) translate(-80 -80)">
    <path d="M80 31c9 9 14 19 14 28"/>
    <path d="M80 31c9 9 14 19 14 28" transform="rotate(120 80 80)"/>
    <path d="M80 31c9 9 14 19 14 28" transform="rotate(240 80 80)"/>
  </g>

  <g filter="url(#ribbon-shadow)" transform="translate(80 80) scale(1.12) translate(-80 -80)">
    <circle cx="80" cy="80" r="8.5" fill="url(#earth-core)" stroke="#ffe2a0" stroke-width="2"/>
  </g>
</svg>
