<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Khoảng cách giữa bản đồ và lãnh thổ</title>
  <desc id="desc">Bản đồ trong prompt là một đường đi sạch sẽ, trong khi lãnh thổ thật chứa ngã rẽ, chướng ngại và những điều chưa biết.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="1" stop-color="#111a35"/>
    </linearGradient>
    <linearGradient id="mapPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c2c58"/>
      <stop offset="1" stop-color="#10223f"/>
    </linearGradient>
    <linearGradient id="terrainPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181d35"/>
      <stop offset="1" stop-color="#2b1b2b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#4f8bd6" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="76" text-anchor="middle" fill="#f7fbff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Bản đồ không phải là lãnh thổ</text>
  <text x="800" y="118" text-anchor="middle" fill="#9db5d5" font-family="Inter, Arial, sans-serif" font-size="24">Prompt mô tả con đường lý tưởng; hệ thống thật chứa những điều chưa biết.</text>

  <g>
    <rect x="70" y="160" width="640" height="650" rx="30" fill="url(#mapPanel)" stroke="#2f76ba" stroke-width="2"/>
    <rect x="70" y="160" width="640" height="650" rx="30" fill="url(#grid)"/>
    <text x="110" y="222" fill="#70c8ff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2">BẢN ĐỒ TRONG PROMPT</text>
    <text x="110" y="261" fill="#d8e9fa" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="600">Một đường đi sạch sẽ</text>

    <path d="M150 690 C210 620 215 540 300 500 S440 420 510 350 S585 280 640 255" fill="none" stroke="#52b8ff" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="150" cy="690" r="22" fill="#07152d" stroke="#8ed8ff" stroke-width="8"/>
    <circle cx="300" cy="500" r="14" fill="#8ed8ff"/>
    <circle cx="510" cy="350" r="14" fill="#8ed8ff"/>
    <path d="M625 238 l28 17 -29 16" fill="none" stroke="#8ed8ff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

    <g fill="#132d4c" stroke="#4e8ac6" stroke-width="2">
      <rect x="140" y="304" width="150" height="68" rx="14"/>
      <rect x="348" y="620" width="155" height="68" rx="14"/>
      <rect x="482" y="476" width="162" height="68" rx="14"/>
    </g>
    <g fill="#c7ddf4" font-family="Inter, Arial, sans-serif" font-size="20" text-anchor="middle">
      <text x="215" y="345">Yêu cầu rõ</text>
      <text x="425" y="661">Kế hoạch đẹp</text>
      <text x="563" y="517">Đường thẳng</text>
    </g>
  </g>

  <g>
    <rect x="890" y="160" width="640" height="650" rx="30" fill="url(#terrainPanel)" stroke="#865a7c" stroke-width="2"/>
    <text x="930" y="222" fill="#ffbf78" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="2">LÃNH THỔ THỰC TẾ</text>
    <text x="930" y="261" fill="#f6e6da" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="600">Một hệ thống đầy bất ngờ</text>

    <path d="M960 700 C1030 620 1020 555 1110 530 S1210 465 1240 390 S1355 320 1460 268" fill="none" stroke="#f3a95d" stroke-width="11" stroke-linecap="round" stroke-dasharray="24 18" filter="url(#glow)"/>

    <g fill="#14182a" stroke="#e08b52" stroke-width="3">
      <path d="M1000 560 l76 -92 72 92 z"/>
      <path d="M1190 690 l92 -125 98 125 z"/>
      <path d="M1320 420 l56 -74 58 74 z"/>
    </g>
    <g fill="#f7bd77" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle">
      <text x="1072" y="585">Hệ thống cũ</text>
      <text x="1285" y="718">Edge case</text>
      <text x="1376" y="444">Quy định ngầm</text>
    </g>

    <g transform="translate(1080 325)">
      <circle r="46" fill="#2a1b2d" stroke="#ffcc74" stroke-width="5"/>
      <text y="14" text-anchor="middle" fill="#ffcc74" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800">?</text>
    </g>
    <g transform="translate(1410 610)">
      <circle r="46" fill="#2a1b2d" stroke="#ffcc74" stroke-width="5"/>
      <text y="14" text-anchor="middle" fill="#ffcc74" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="800">?</text>
    </g>
  </g>

  <g>
    <rect x="690" y="380" width="220" height="140" rx="70" fill="#07152d" stroke="#8aa9cf" stroke-width="2"/>
    <text x="800" y="427" text-anchor="middle" fill="#9db5d5" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5">KHOẢNG CÁCH</text>
    <text x="800" y="466" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">UNKNOWN</text>
    <path d="M748 492 H852" stroke="#62c6ff" stroke-width="5" stroke-linecap="round"/>
    <path d="M838 480 l18 12 -18 12" fill="none" stroke="#62c6ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
