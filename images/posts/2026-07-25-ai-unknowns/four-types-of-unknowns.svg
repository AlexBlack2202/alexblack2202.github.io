<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bốn loại điều đã biết và chưa biết</title>
  <desc id="desc">Bốn ô giải thích known knowns, known unknowns, unknown knowns và unknown unknowns khi làm việc với AI Agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="1" stop-color="#161b35"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000814" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="70" text-anchor="middle" fill="#f7fbff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Bốn căn phòng của sự không biết</text>
  <text x="800" y="112" text-anchor="middle" fill="#9db5d5" font-family="Inter, Arial, sans-serif" font-size="24">Mỗi loại khoảng trống cần một cách khám phá khác nhau.</text>

  <g transform="translate(72 158)" filter="url(#shadow)">
    <rect width="698" height="294" rx="28" fill="#0c3157" stroke="#3da9e8" stroke-width="2"/>
    <circle cx="72" cy="72" r="34" fill="#52b8ff"/>
    <path d="M56 73 l11 11 22 -26" fill="none" stroke="#06182f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="128" y="62" fill="#7ed4ff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.5">KNOWN KNOWNS</text>
    <text x="128" y="98" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Biết và đã nói ra</text>
    <text x="54" y="165" fill="#c9def1" font-family="Inter, Arial, sans-serif" font-size="22">Nằm trong prompt, spec hoặc tài liệu.</text>
    <text x="54" y="204" fill="#c9def1" font-family="Inter, Arial, sans-serif" font-size="22">Agent có thể làm theo mà ít phải đoán.</text>
    <rect x="54" y="236" width="270" height="38" rx="19" fill="#123f68"/>
    <text x="189" y="262" text-anchor="middle" fill="#8ed8ff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Cách xử lý: ghi rõ</text>
  </g>

  <g transform="translate(830 158)" filter="url(#shadow)">
    <rect width="698" height="294" rx="28" fill="#2b2948" stroke="#8e83e6" stroke-width="2"/>
    <circle cx="72" cy="72" r="34" fill="#9688ef"/>
    <text x="72" y="84" text-anchor="middle" fill="#15142a" font-family="Inter, Arial, sans-serif" font-size="40" font-weight="800">?</text>
    <text x="128" y="62" fill="#b9b0ff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.5">KNOWN UNKNOWNS</text>
    <text x="128" y="98" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Biết là chưa rõ</text>
    <text x="54" y="165" fill="#d9d5f2" font-family="Inter, Arial, sans-serif" font-size="22">Chưa có câu trả lời, nhưng đã biết cần hỏi gì.</text>
    <text x="54" y="204" fill="#d9d5f2" font-family="Inter, Arial, sans-serif" font-size="22">Có thể đưa thành quyết định trước khi làm.</text>
    <rect x="54" y="236" width="310" height="38" rx="19" fill="#3a355e"/>
    <text x="209" y="262" text-anchor="middle" fill="#c5bdff" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Cách xử lý: đặt câu hỏi</text>
  </g>

  <g transform="translate(72 500)" filter="url(#shadow)">
    <rect width="698" height="294" rx="28" fill="#193746" stroke="#52c5b1" stroke-width="2"/>
    <circle cx="72" cy="72" r="34" fill="#59d1bd"/>
    <path d="M56 70 C66 55 80 55 90 70 C80 86 66 86 56 70 z" fill="none" stroke="#0b2c32" stroke-width="5"/>
    <circle cx="73" cy="70" r="7" fill="#0b2c32"/>
    <text x="128" y="62" fill="#82e2d1" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.5">UNKNOWN KNOWNS</text>
    <text x="128" y="98" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Biết nhưng chưa viết xuống</text>
    <text x="54" y="165" fill="#cde8e2" font-family="Inter, Arial, sans-serif" font-size="22">Kinh nghiệm, tiêu chuẩn và thói quen nằm trong đầu.</text>
    <text x="54" y="204" fill="#cde8e2" font-family="Inter, Arial, sans-serif" font-size="22">Chỉ lộ ra khi nhìn prototype hoặc vật mẫu.</text>
    <rect x="54" y="236" width="390" height="38" rx="19" fill="#234b55"/>
    <text x="249" y="262" text-anchor="middle" fill="#8ee7d7" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Cách xử lý: prototype và phỏng vấn</text>
  </g>

  <g transform="translate(830 500)" filter="url(#shadow)">
    <rect width="698" height="294" rx="28" fill="#412a2d" stroke="#ec9368" stroke-width="2"/>
    <circle cx="72" cy="72" r="34" fill="#ef9b71"/>
    <path d="M55 55 l34 34 M89 55 L55 89" stroke="#351819" stroke-width="7" stroke-linecap="round"/>
    <text x="128" y="62" fill="#ffb48e" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.5">UNKNOWN UNKNOWNS</text>
    <text x="128" y="98" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Chưa biết để mà hỏi</text>
    <text x="54" y="165" fill="#f0d8cd" font-family="Inter, Arial, sans-serif" font-size="22">Edge case, ràng buộc và rủi ro chưa ai nhìn thấy.</text>
    <text x="54" y="204" fill="#f0d8cd" font-family="Inter, Arial, sans-serif" font-size="22">Đây là vùng Agent dễ tự điền bằng giả định.</text>
    <rect x="54" y="236" width="370" height="38" rx="19" fill="#58363a"/>
    <text x="239" y="262" text-anchor="middle" fill="#ffc0a0" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600">Cách xử lý: blind spot pass</text>
  </g>
</svg>
