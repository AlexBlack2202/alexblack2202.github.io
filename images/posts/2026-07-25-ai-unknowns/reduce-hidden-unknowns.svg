<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tìm unknowns sớm làm phần chìm nhỏ lại</title>
  <desc id="desc">So sánh trước và sau khi khám phá: ban đầu phần lớn rủi ro chìm dưới mặt nước, sau khi quét điểm mù nhiều vấn đề được đưa lên thành câu hỏi và quyết định rõ ràng.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152d"/>
      <stop offset="1" stop-color="#141c35"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17629a" stop-opacity=".58"/>
      <stop offset="1" stop-color="#06172f" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7f4ff"/>
      <stop offset=".45" stop-color="#70c8f4"/>
      <stop offset="1" stop-color="#2977b7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <text x="800" y="70" text-anchor="middle" fill="#f7fbff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Tìm unknowns sớm làm phần chìm nhỏ lại</text>
  <text x="800" y="112" text-anchor="middle" fill="#9db5d5" font-family="Inter, Arial, sans-serif" font-size="24">Mục tiêu không phải biết hết, mà là biến rủi ro vô hình thành câu hỏi có thể xử lý.</text>

  <line x1="800" y1="150" x2="800" y2="835" stroke="#45617f" stroke-width="2" stroke-dasharray="10 14"/>
  <rect x="50" y="395" width="700" height="420" rx="28" fill="url(#water)"/>
  <rect x="850" y="395" width="700" height="420" rx="28" fill="url(#water)"/>
  <line x1="50" y1="395" x2="750" y2="395" stroke="#5fc7ff" stroke-width="5" filter="url(#glow)"/>
  <line x1="850" y1="395" x2="1550" y2="395" stroke="#5fc7ff" stroke-width="5" filter="url(#glow)"/>

  <text x="400" y="176" text-anchor="middle" fill="#ffb58d" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.6">TRƯỚC KHI KHÁM PHÁ</text>
  <text x="1200" y="176" text-anchor="middle" fill="#80ddcc" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.6">SAU KHI TÌM UNKNOWNS</text>

  <g>
    <path d="M305 396 L355 268 L440 228 L505 286 L548 396 z" fill="url(#ice)" stroke="#a7e4ff" stroke-width="3"/>
    <path d="M170 396 L305 396 L548 396 L655 650 L548 770 L280 748 L128 555 z" fill="url(#ice)" opacity=".8" stroke="#66bce9" stroke-width="3"/>
    <text x="425" y="330" text-anchor="middle" fill="#08223c" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">PROMPT</text>
    <text x="395" y="470" text-anchor="middle" fill="#0a2d4f" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">GIẢ ĐỊNH ẨN</text>
    <g fill="#123a5f" font-family="Inter, Arial, sans-serif" font-size="20" text-anchor="middle">
      <text x="282" y="535">Edge case</text>
      <text x="508" y="535">Legacy</text>
      <text x="250" y="605">Bảo mật</text>
      <text x="510" y="605">Dữ liệu</text>
      <text x="318" y="680">Quy tắc ngầm</text>
      <text x="522" y="680">Phụ thuộc</text>
    </g>
    <text x="400" y="852" text-anchor="middle" fill="#efb59a" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Phần chìm lớn → Agent phải đoán nhiều</text>
  </g>

  <g>
    <path d="M1080 396 L1124 300 L1195 270 L1255 314 L1290 396 z" fill="url(#ice)" stroke="#a7e4ff" stroke-width="3"/>
    <path d="M1040 396 L1290 396 L1350 550 L1270 635 L1110 620 L1000 520 z" fill="url(#ice)" opacity=".76" stroke="#66bce9" stroke-width="3"/>
    <text x="1190" y="346" text-anchor="middle" fill="#08223c" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700">KẾ HOẠCH</text>

    <g font-family="Inter, Arial, sans-serif">
      <g transform="translate(895 210)">
        <rect width="235" height="64" rx="18" fill="#183c5d" stroke="#58b9ef" stroke-width="2"/>
        <text x="117" y="40" text-anchor="middle" fill="#d8f1ff" font-size="20" font-weight="600">Câu hỏi cần trả lời</text>
      </g>
      <g transform="translate(1175 190)">
        <rect width="245" height="64" rx="18" fill="#29434a" stroke="#5ed5bd" stroke-width="2"/>
        <text x="122" y="40" text-anchor="middle" fill="#ddfff8" font-size="20" font-weight="600">Quyết định đã chốt</text>
      </g>
      <g transform="translate(920 300)">
        <rect width="205" height="58" rx="17" fill="#3c334f" stroke="#a695e7" stroke-width="2"/>
        <text x="102" y="37" text-anchor="middle" fill="#eee9ff" font-size="19" font-weight="600">Vật mẫu</text>
      </g>
      <g transform="translate(1300 290)">
        <rect width="190" height="58" rx="17" fill="#493336" stroke="#ef9a70" stroke-width="2"/>
        <text x="95" y="37" text-anchor="middle" fill="#fff0e8" font-size="19" font-weight="600">Rủi ro đã thấy</text>
      </g>
    </g>

    <g fill="#143b60" font-family="Inter, Arial, sans-serif" font-size="19" text-anchor="middle">
      <text x="1130" y="475">Ngoại lệ mới</text>
      <text x="1260" y="520">Phụ thuộc lạ</text>
      <text x="1175" y="570">Unknown còn lại</text>
    </g>
    <text x="1200" y="852" text-anchor="middle" fill="#91e0d0" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600">Phần chìm nhỏ hơn → ít quyết định mù</text>
  </g>

  <g transform="translate(760 430)">
    <circle cx="40" cy="40" r="38" fill="#0a203c" stroke="#64c8ff" stroke-width="3"/>
    <path d="M22 40 H56 M46 28 l12 12 -12 12" fill="none" stroke="#87dcff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
