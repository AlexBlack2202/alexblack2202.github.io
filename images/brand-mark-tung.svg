<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Phạm Duy Tùng</title>
  <desc id="desc">A pearl glass T monogram with three connected endpoints for AI, data, and systems.</desc>
  <defs>
    <linearGradient id="pearl" x1="20" y1="16" x2="142" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#55ddf7"/>
      <stop offset="0.48" stop-color="#8173ee"/>
      <stop offset="1" stop-color="#f47fbd"/>
    </linearGradient>
    <linearGradient id="glass" x1="52" y1="37" x2="105" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.98"/>
      <stop offset="0.58" stop-color="#fff" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#f9f6ff" stop-opacity="0.68"/>
    </linearGradient>
    <radialGradient id="shine" cx="0" cy="0" r="1" gradientTransform="translate(43 32) rotate(45) scale(87)">
      <stop stop-color="#fff" stop-opacity="0.92"/>
      <stop offset="0.46" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#5545a6" flood-opacity="0.28"/>
    </filter>
    <filter id="mark-shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4a388f" flood-opacity="0.3"/>
    </filter>
    <clipPath id="squircle">
      <rect x="8" y="8" width="144" height="144" rx="43"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="8" y="8" width="144" height="144" rx="43" fill="url(#pearl)"/>
    <g clip-path="url(#squircle)">
      <circle cx="23" cy="23" r="84" fill="url(#shine)"/>
      <path d="M-8 126C26 95 49 92 78 105c27 12 52 9 92-25v92H-8Z" fill="#fff" opacity="0.1"/>
      <path d="M20 13h120c6 0 11 5 11 11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.62"/>
    </g>
    <rect x="9.5" y="9.5" width="141" height="141" rx="41.5" fill="none" stroke="#fff" stroke-opacity="0.72" stroke-width="3"/>
  </g>

  <g filter="url(#mark-shadow)" fill="none" stroke="url(#glass)" stroke-width="23" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 51h76"/>
    <path d="M80 53v65"/>
  </g>
  <g fill="#fff" opacity="0.96">
    <circle cx="42" cy="51" r="5.5"/>
    <circle cx="118" cy="51" r="5.5"/>
    <circle cx="80" cy="118" r="5.5"/>
  </g>
  <path d="M43 44h73" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.56"/>
  <path d="M73 61v50" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.36"/>
</svg>
