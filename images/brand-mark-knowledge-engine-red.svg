<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge Engine</title>
  <desc id="desc">An open book whose spine becomes a DNA helix and branches into a neural network.</desc>
  <defs>
    <linearGradient id="crimson-glass" x1="20" y1="15" x2="144" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff6748"/>
      <stop offset="0.38" stop-color="#ec2538"/>
      <stop offset="0.72" stop-color="#bd1232"/>
      <stop offset="1" stop-color="#68152b"/>
    </linearGradient>
    <radialGradient id="glass-shine" cx="0" cy="0" r="1" gradientTransform="translate(37 27) rotate(47) scale(105)">
      <stop stop-color="#fff" stop-opacity="0.78"/>
      <stop offset="0.36" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page-glass" x1="51" y1="90" x2="107" y2="137" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf8"/>
      <stop offset="0.62" stop-color="#fff0e8"/>
      <stop offset="1" stop-color="#ffc8b7"/>
    </linearGradient>
    <linearGradient id="dna-pearl" x1="68" y1="35" x2="93" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff7df"/>
      <stop offset="0.48" stop-color="#fff"/>
      <stop offset="1" stop-color="#ffd0bf"/>
    </linearGradient>
    <linearGradient id="dna-fire" x1="91" y1="36" x2="67" y2="93" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd36f"/>
      <stop offset="0.5" stop-color="#ff9a68"/>
      <stop offset="1" stop-color="#fff0d3"/>
    </linearGradient>
    <radialGradient id="node-core" cx="0" cy="0" r="1" gradientTransform="translate(77 18) rotate(55) scale(16)">
      <stop stop-color="#fff3a8"/>
      <stop offset="0.5" stop-color="#ffb341"/>
      <stop offset="1" stop-color="#df5a2d"/>
    </radialGradient>
    <filter id="base-shadow" x="-30%" y="-30%" width="160%" height="175%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="11" stdDeviation="9" flood-color="#531126" flood-opacity="0.32"/>
    </filter>
    <filter id="symbol-shadow" x="-35%" y="-35%" width="170%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#5d1228" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle">
      <rect x="8" y="8" width="144" height="144" rx="43"/>
    </clipPath>
  </defs>

  <g filter="url(#base-shadow)">
    <rect x="8" y="8" width="144" height="144" rx="43" fill="url(#crimson-glass)"/>
    <g clip-path="url(#squircle)">
      <circle cx="25" cy="21" r="98" fill="url(#glass-shine)"/>
      <path d="M-8 129c35-27 71-25 101-3 28 20 55 18 84-8v53H-8Z" fill="#ff9d76" opacity="0.13"/>
      <path d="M21 14h116c7 0 13 6 13 13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.46"/>
    </g>
    <rect x="9.5" y="9.5" width="141" height="141" rx="41.5" fill="none" stroke="#fff" stroke-width="3" stroke-opacity="0.62"/>
  </g>

  <g filter="url(#symbol-shadow)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M80 39 59 27M80 39V20M80 39l21-12" stroke="#fff6df" stroke-width="3.2" opacity="0.9"/>
      <path d="M80 91c0-8 13-10 13-19S67 61 67 52s13-10 13-17" stroke="url(#dna-pearl)" stroke-width="6"/>
      <path d="M80 91c0-8-13-10-13-19s26-11 26-20-13-10-13-17" stroke="url(#dna-fire)" stroke-width="6"/>
      <path d="M70 82h20M71 63h18M71 45h18" stroke="#fff" stroke-width="2.4" opacity="0.7"/>
    </g>

    <g>
      <circle cx="59" cy="27" r="5.5" fill="#fff4dc" stroke="#ffb17d" stroke-width="2"/>
      <circle cx="80" cy="20" r="6.5" fill="url(#node-core)" stroke="#fff0bd" stroke-width="2"/>
      <circle cx="101" cy="27" r="5.5" fill="#fff4dc" stroke="#ffb17d" stroke-width="2"/>
    </g>

    <path d="M80 98C67 89 51 88 34 93v34c18-5 33-1 46 9Z" fill="url(#page-glass)" stroke="#fff8f2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M80 98c13-9 29-10 46-5v34c-18-5-33-1-46 9Z" fill="url(#page-glass)" stroke="#fff8f2" stroke-width="3" stroke-linejoin="round"/>
    <path d="M80 99v36" fill="none" stroke="#db2840" stroke-width="3" stroke-linecap="round" opacity="0.68"/>

    <g fill="none" stroke="#c81836" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.86">
      <path d="M72 106H58l-7 7H43"/>
      <path d="M72 118H61l-5 5"/>
      <path d="M88 106h14l7 7h8"/>
      <path d="M88 118h11l5 5"/>
    </g>
    <g fill="#e22439">
      <circle cx="43" cy="113" r="3.2"/>
      <circle cx="56" cy="123" r="3.2"/>
      <circle cx="117" cy="113" r="3.2"/>
      <circle cx="104" cy="123" r="3.2"/>
    </g>
    <path d="M39 96c12-3 23-2 33 3" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.64"/>
    <path d="M88 99c10-5 21-6 33-3" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity="0.64"/>
  </g>
</svg>
